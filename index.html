<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trazabilidad PHC — Captura</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E1B16">
<link rel="icon" href="icons/icono-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icono-192.png">
</head>
<body>

<header>
  <div class="header-brand">
    <img src="logo-bacao.png" alt="Bacao" class="brand-logo">
    <div class="header-titles">
      <h1>Trazabilidad PHC</h1>
      <span class="sub" id="fecha-hoy"></span>
      <span class="sub" id="sync-status" style="color:var(--warn);"></span>
    </div>
  </div>
  <span class="page-role">Captura</span>
</header>

<div class="page-links">
  <a href="index.html" class="current">Captura</a>
  <span>·</span>
  <a href="tablero.html">Tablero</a>
  <span>·</span>
  <a href="panel.html">Panel</a>
</div>

<div class="operario-bar">
  <label for="operario-nombre">Operario:</label>
  <input type="text" id="operario-nombre" placeholder="Tu nombre (queda registrado en cada acción)">
</div>

<nav class="tabs">
  <button data-tab="registro" class="active">Registro</button>
  <button data-tab="operacion">Operación</button>
</nav>

<main>

  <div class="panel active" id="panel-registro">
    <p class="block-title">Recepción reciente</p>
    <div class="dash-grid" id="resumen-hoy-ayer" style="margin-bottom:24px;"></div>

    <p class="block-title">Registrar pesaje de fruto fresco</p>
    <div class="form-grid">
      <div class="field">
        <label>Fecha y hora de entrada</label>
        <input type="datetime-local" id="f-fecha">
      </div>
      <div class="field">
        <label>Denominación</label>
        <select id="f-denom">
          <option value="ccn51">CCN-51</option>
          <option value="aromatico">Aromático</option>
          <option value="upia">Upia</option>
        </select>
      </div>
      <div class="field">
        <label>Peso de este pesaje (kg)</label>
        <input type="number" id="f-peso" min="0" step="0.1">
      </div>
      <div class="field">
        <label>N° registro báscula</label>
        <input type="text" id="f-bascula">
      </div>
      <div style="grid-column:1/-1; display:flex; align-items:center; gap:8px; margin-bottom:12px;">
        <input type="checkbox" id="f-directo" style="width:auto;">
        <label for="f-directo" style="font-size:13px; color:var(--ink-dim);">Enviar directo a despulpado (omitir recepción en bines)</label>
      </div>
    </div>
    <div class="preview-codigo">Código de bache del día: <b id="codigo-preview">—</b></div>
    <div class="preview-codigo" id="bines-preview"></div>
    <div id="form-msg"></div>
    <button id="btn-registrar" style="margin-top:12px;">Registrar pesaje</button>
  </div>

  <div class="panel" id="panel-operacion">
    <p class="block-title">Flujo de inventario</p>
    <div style="overflow-x:auto; margin-bottom:26px;"><div id="flujo-svg"></div></div>

    <p class="block-title">Capacidad ocupada por unidad de proceso</p>
    <div id="cap-table" style="margin-bottom:28px;"></div>

    <p class="block-title">Baches por unidad de proceso (excesos de tiempo)</p>
    <div class="dash-grid" id="op-dash-grid" style="margin-bottom:28px;"></div>

    <p class="block-title" id="op-count">Baches activos</p>
    <div id="op-list"></div>
  </div>

</main>

<script src="shared.js"></script>
<script src="captura.js"></script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{ /* si falla, la app sigue funcionando igual, solo sin modo offline */ });
    });
  }
</script>
</body>
</html>
